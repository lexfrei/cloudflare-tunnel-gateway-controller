name: Validate helm-docs
description: >-
  Regenerate the chart README with the helm-docs pinned in hack/tools/go.mod
  and fail if it differs from the committed file. Shared by pr.yaml and
  release.yaml so a change to how the README is regenerated is made once.
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: hack/tools/go.mod
        cache: true
        cache-dependency-path: hack/tools/go.sum

    - name: Regenerate and compare the chart README
      shell: bash
      run: |
        CHART_DIR="charts/cloudflare-tunnel-gateway-controller"
        echo "Validating README.md is up to date..."
        make helm-docs

        if git diff --exit-code "$CHART_DIR/README.md" > /dev/null 2>&1; then
          echo "README.md is up to date"
        else
          echo "ERROR: README.md is out of date!"
          echo "Please run: make helm-docs"
          echo ""
          echo "Diff:"
          git diff "$CHART_DIR/README.md"
          exit 1
        fi

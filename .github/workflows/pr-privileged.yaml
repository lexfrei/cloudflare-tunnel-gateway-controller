name: PR Privileged Actions

on:
  workflow_run:
    workflows: ["PR Checks and Build"]
    types: [completed]

permissions:
  pull-requests: write
  security-events: write
  actions: read

jobs:
  upload-sarif:
    name: Upload Security Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate PR number
        id: pr
        run: |
          PR_NUMBER=$(cat pr-number.txt)
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # pr-number.txt comes out of the pull_request run, which a fork's own
      # copy of pr.yaml produces, so it can name any PR. Act on that PR only
      # when it is the one this run built: same head commit, same head repo.
      - name: Check the PR is the one this run built
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }} ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.head.sha) \(.head.repo.full_name)"')"
          if [[ "${pr_head}" == "${RUN_HEAD}" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #${PR_NUMBER} is at '${pr_head}', this run built '${RUN_HEAD}'; skipping"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download SARIF artifact
        id: download-sarif
        if: steps.match.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: trivy-sarif
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: steps.match.outputs.current == 'true' && steps.download-sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}

  notify:
    name: Notify PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate PR number
        id: pr
        run: |
          PR_NUMBER=$(cat pr-number.txt)
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # pr-number.txt comes out of the pull_request run, which a fork's own
      # copy of pr.yaml produces, so it can name any PR. Act on that PR only
      # when it is the one this run built: same head commit, same head repo.
      - name: Check the PR is the one this run built
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }} ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.head.sha) \(.head.repo.full_name)"')"
          if [[ "${pr_head}" == "${RUN_HEAD}" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #${PR_NUMBER} is at '${pr_head}', this run built '${RUN_HEAD}'; skipping"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # When ttl.sh refused uploads the run still succeeds, but merge-manifests
      # uploads no image references.
      - name: Check whether the run published
        id: published
        if: steps.match.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=image-ref-controller" --jq '.total_count')"
          if [[ "${count}" == "0" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if first build
        id: first_build
        if: steps.match.outputs.current == 'true' && steps.published.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }}
            });

            const hasLabel = labels.data.some(label => label.name === 'Container Available');
            return hasLabel ? 'false' : 'true';

      - name: Add Container Available label
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              labels: ['Container Available']
            })

      # A label left by an earlier published build would contradict the
      # comment below.
      - name: Remove Container Available label
        if: steps.match.outputs.current == 'true' && steps.published.outputs.published == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.pr.outputs.number }},
                name: 'Container Available'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Download image references
        if: steps.match.outputs.current == 'true' && steps.published.outputs.published == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-ref-*
          merge-multiple: true
          path: image-refs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The references come out of a pull_request run, which a fork's own copy
      # of pr.yaml produces, and go into a comment this token writes. Accept
      # only the exact shape merge-manifests exports.
      - name: Read and validate image references
        id: refs
        if: steps.match.outputs.current == 'true' && steps.published.outputs.published == 'true'
        run: |
          set -euo pipefail
          read_ref() {
            local component="$1" image="$2" value
            value="$(tr -d '[:space:]' < "image-refs/${component}.ref")"
            if ! [[ "${value}" =~ ^"${image}"@sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: ${component}.ref is not a digest-pinned reference to ${image}"
              exit 1
            fi
            echo "${component}=${value}" >> "$GITHUB_OUTPUT"
          }
          read_ref controller ttl.sh/cf-tunnel-gateway-ctrl
          read_ref proxy ttl.sh/cf-tunnel-gateway-proxy

      # One comment per PR, rewritten on every successful run: the digests
      # change with each build, and a comment naming an older build's digest
      # would send readers to the wrong image.
      - name: Comment on PR
        if: steps.match.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PUBLISHED: ${{ steps.published.outputs.published }}
          CONTROLLER_REF: ${{ steps.refs.outputs.controller }}
          PROXY_REF: ${{ steps.refs.outputs.proxy }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const marker = '<!-- ci-images -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const chartVersion = `0.0.0-pr.${prNumber}-1d`;
            const fence = '```';

            const unpublished = [
              marker,
              '## Container images not published',
              '',
              `ttl.sh was not accepting uploads when [this run](${process.env.RUN_URL}) built ${process.env.HEAD_SHA}, so the images and the chart were built but not pushed. Re-run this PR's CI once ttl.sh accepts uploads again; until then \`./hack/conformance-setup.sh --use-ci-images ${prNumber}\` has nothing to deploy.`,
            ].join('\n');

            const published = [
              marker,
              '## Container images available',
              '',
              `Built from ${process.env.HEAD_SHA} in [this run](${process.env.RUN_URL}). Pull by digest: the \`pr-${prNumber}-1d\` tags on ttl.sh are anonymous, and anyone can overwrite them.`,
              '',
              '**Controller (amd64 + arm64):**',
              `${fence}bash`,
              `podman pull ${process.env.CONTROLLER_REF}`,
              fence,
              '',
              '**Proxy (amd64 + arm64):**',
              `${fence}bash`,
              `podman pull ${process.env.PROXY_REF}`,
              fence,
              '',
              '## Helm chart available',
              '',
              `${fence}bash`,
              `helm install test oci://ttl.sh/cloudflare-tunnel-gateway-controller --version ${chartVersion}`,
              fence,
              '',
              `The chart is published under a mutable tag too, and its values point at the \`pr-${prNumber}-1d\` image tags. \`./hack/conformance-setup.sh --use-ci-images ${prNumber}\` deploys the chart artifact of this PR's latest successful run instead, verified against the PR head, and pulls that run's images by digest.`,
              '',
              `> **Note:** Rebuilt on every commit; this comment follows the latest successful build. The \`-1d\` in these tags sets no lifetime -- ttl.sh reads one only from a tag that is entirely a duration -- so the images expire on ttl.sh's own schedule. Re-run this PR's CI to republish.`,
            ].join('\n');

            const body = process.env.PUBLISHED === 'true' ? published : unpublished;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

{{- if not (eq (include "cf-tunnel-gw-ctrl.perGatewayPlanesEnabled" .) "true") }}
# With per-Gateway data planes off, the ClusterRole carries no Secret rule and
# no Deployment write at all (clusterrole.yaml): Secret access becomes these
# namespaced Roles, and the controller's cache is scoped to the same namespace
# list (--secret-namespaces, deployment.yaml), so the controller cannot read a
# Secret outside them even through a cached informer.
#
# The release namespace holds everything the controller itself manages — the
# Cloudflare credentials (by default), the generated config-API auth token,
# the config API CA and the shared proxy's serving certificate — so it gets
# create too (update on the one in-place-renewed Secret stays with
# role-config-tls.yaml). It is also the only namespace whose proxy Deployment
# the ProxySecretReconciler patches on tunnel-token rotation (issue #114),
# which is the write the ClusterRole's deployments rule loses with the planes
# off.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create"]
  # The shared proxy Deployment's token-revision merge-patch (issue #114).
  # resourceNames applies to patch, so the grant names the one Deployment the
  # reconciler rolls.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "cf-tunnel-gw-ctrl.proxyFullname" . | quote }}]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "cf-tunnel-gw-ctrl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range (splitList "," (include "cf-tunnel-gw-ctrl.secretNamespaces" .)) }}
{{- if ne . $.Release.Namespace }}
---
# Read-only Secret access in an explicitly listed namespace: Cloudflare
# credentials kept outside the release namespace, Gateway listener /
# backend-TLS certificateRefs, BackendTLSPolicy CA Secrets. Nothing is ever
# created or written outside the release namespace with the planes off.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" $ }}-secrets-read
  namespace: {{ . }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" $ }}-secrets-read
  namespace: {{ . }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cf-tunnel-gw-ctrl.fullname" $ }}-secrets-read
subjects:
  - kind: ServiceAccount
    name: {{ include "cf-tunnel-gw-ctrl.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}

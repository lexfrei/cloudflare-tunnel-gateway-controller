{{- if (eq (include "cf-tunnel-gw-ctrl.configAPITLSEnabled" .) "true") }}
# The controller renews the shared proxy's config API certificate in place,
# since the proxy Deployment names that Secret statically. update is granted
# on that one Secret, in this namespace, and nowhere else: resourceNames
# applies to update (not to create, which the ClusterRole already holds).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-config-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "cf-tunnel-gw-ctrl.proxyConfigTLSSecretName" . | quote }}]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-config-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-config-tls
subjects:
  - kind: ServiceAccount
    name: {{ include "cf-tunnel-gw-ctrl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

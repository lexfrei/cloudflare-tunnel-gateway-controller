{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cf-tunnel-gw-ctrl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics and health checks
    - {{- if .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
        - protocol: TCP
          port: {{ .Values.service.healthPort }}
  {{- $cfRanges := .Values.networkPolicy.cloudflareIpRanges | default dict }}
  {{- if and (not $cfRanges.ipv4) (not $cfRanges.ipv6) }}
  {{- fail "networkPolicy.enabled is true but networkPolicy.cloudflareIpRanges is empty: the Cloudflare-egress rule would render an empty 'to:', which NetworkPolicy reads as allow-all on 443, the opposite of restriction. Populate the ranges from https://www.cloudflare.com/ips/, or set networkPolicy.enabled to false, which also drops this policy's ingress restriction. While networkPolicy.kubernetesApiIpBlocks is empty the Kubernetes API rule already permits 443 everywhere, so this rule restricts nothing either way: https://cf.k8s.lex.la/latest/reference/security/#egress-requirements" }}
  {{- end }}
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API. With no destinations listed this rule carries no `to`,
    # which permits its ports everywhere and leaves the Cloudflare rule below
    # inert — the chart's long-standing behaviour, kept because the alternative
    # is worse: a catch-all ipBlock is not equivalent, and on some CNIs would
    # deny this controller its own API server. Narrow it with
    # kubernetesApiIpBlocks, whose comment carries the reasoning.
    -
      {{- with .Values.networkPolicy.kubernetesApiIpBlocks }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Cloudflare API - configurable IP ranges for security
    - to:
        {{- range .Values.networkPolicy.cloudflareIpRanges.ipv4 }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.cloudflareIpRanges.ipv6 }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    # The proxies' config API. The proxy policy admits this connection on its
    # ingress side and states that a config push must never be locked out;
    # forbidding it here made that promise one-sided. Gateway status stays clean
    # while it is blocked — the push is non-blocking — so the signals are the
    # per-push error log, the proxy_push sync-error metric, and the route-status
    # diagnostic that names this policy after three consecutive failures.
    # The shared plane, in this namespace: a bare podSelector never leaves the
    # policy's own namespace. It honours proxy.configAPIPort.
    - to:
        - podSelector:
            matchLabels:
              {{- include "cf-tunnel-gw-ctrl.proxySelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.configAPIPort }}
    # Per-Gateway planes, rendered into whichever namespace their Gateway lives
    # in — unknowable here, hence the empty namespaceSelector. Matching the
    # rendered labels rather than opening the port cluster-wide; the controller
    # only ever dials endpoints it discovered, so this bounds the blast radius
    # rather than deciding it.
    #
    # Its own rule because the port differs: proxy.configAPIPort moves the
    # SHARED plane only, while the renderer hardcodes 8081 for every tenant
    # plane (internal/render/render.go). Rendering one rule from the value would
    # permit a port nothing listens on as soon as the value is changed.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflare-tunnel-gateway-proxy
      ports:
        - protocol: TCP
          port: 8081
{{- end }}

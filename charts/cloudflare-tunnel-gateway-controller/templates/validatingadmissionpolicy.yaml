{{- if .Values.ruleNameUniquenessPolicy.enabled }}
# Enforces the Gateway API rule that HTTPRouteRule.name / GRPCRouteRule.name
# MUST be unique within a Route. Upstream ships this check only in the
# experimental-channel CRD CEL; the Standard channel omits it. This native
# ValidatingAdmissionPolicy replicates the same admission rule without owning the
# (upstream) Route CRDs and without a webhook server. It is cluster-scoped and
# applies to every HTTPRoute/GRPCRoute — see values.yaml for the opt-in rationale.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-route-rule-name-unique
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        # Naming v1 alone still covers a write made through any other served
        # version, v1beta1 HTTPRoute included: matchConstraints defaults to
        # matchPolicy Equivalent, so the apiserver relabels such a write into
        # a listed version before the policy runs, and the route CRDs convert
        # with strategy None, so that relabelling cannot fail.
        #
        # The conversion is a relabel, not a normalisation: strategy None
        # rewrites apiVersion and leaves every other field alone, so the CEL
        # below evaluates the object exactly as the client sent it. The
        # hostname-ownership policy names the same resources with a wildcard
        # instead; both draw the same writes, and narrowing that one is a
        # deliberate change rather than a cleanup.
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "grpcroutes"]
  validations:
    - expression: >-
        !has(object.spec.rules) ||
        object.spec.rules.all(l1, !has(l1.name) ||
        object.spec.rules.exists_one(l2, has(l2.name) && l1.name == l2.name))
      message: "Rule name must be unique within the route"
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-route-rule-name-unique
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
spec:
  policyName: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-route-rule-name-unique
  validationActions:
    - Deny
{{- end }}

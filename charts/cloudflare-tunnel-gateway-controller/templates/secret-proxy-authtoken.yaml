{{- if not .Values.proxy.authTokenSecretRef.name }}
{{/*
The config API is NEVER rendered without push auth (mirrors the per-Gateway
data plane's GeneratedAuthSecretName in internal/render/render.go): an
operator who names no authTokenSecretRef still gets an authenticated config
API, not a silently-open one.

The token is looked up against any existing Secret of this name and reused
when found, so a plain `randAlphaNum` does NOT fire on every `helm upgrade` --
that would rotate the token (and roll the proxy pods) on every release, and
break anyone pushing config to the proxy with the previous token in hand.
`lookup` always returns empty during `helm template` / `--dry-run` (no
cluster to query), so those modes always mint a throwaway value -- expected,
and harmless since neither mode touches a real cluster.
*/}}
{{- $secretName := include "cf-tunnel-gw-ctrl.proxyAuthTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict }}
{{- $existingData := $existing.data | default dict }}
{{- $existingToken := get $existingData "auth-token" | default "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.proxyLabels" . | nindent 4 }}
type: Opaque
data:
  # $existingToken, when present, is already base64 (as returned by the API);
  # a freshly generated token is base64-encoded here to match.
  auth-token: {{ $existingToken | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}

{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.controller.gatewayClassName }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.controller.controllerName }}
  {{- /* An explicit name without create points at a config managed outside the chart. */}}
  {{- if or .Values.gatewayClassConfig.create .Values.gatewayClassConfig.name }}
  parametersRef:
    group: cf.k8s.lex.la
    kind: GatewayClassConfig
    name: {{ .Values.gatewayClassConfig.name | default (include "cf-tunnel-gw-ctrl.fullname" .) }}
  {{- end }}
{{- end }}

suite: test proxy config-API auth-token secret
templates:
  - secret-proxy-authtoken.yaml
tests:
  # Secure-by-default: an operator who names no authTokenSecretRef must still
  # get an authenticated config API, not a silently-open one. The chart
  # generates the Secret itself so `helm install` alone is enough.
  - it: should generate a Secret with a random token when authTokenSecretRef.name is empty
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-proxy-auth-token
      - matchRegex:
          path: data["auth-token"]
          # base64 of 32 random alphanumeric chars
          pattern: "^[A-Za-z0-9+/=]{20,}$"

  # A helm template render has no cluster to look up against (lookup always
  # returns empty there and during --dry-run) — the chart must still render
  # successfully, generating a throwaway value rather than failing.
  - it: should still render successfully with no prior Secret to look up (helm template semantics)
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token-secret
    asserts:
      - hasDocuments:
          count: 1
      - notEqual:
          path: data["auth-token"]
          value: ""

  # Upgrade safety: an operator who already names their own Secret must never
  # have it silently overwritten by the generated one, even if the names
  # happened to collide. The chart guarantees this structurally -- this
  # template renders NO Secret object at all when authTokenSecretRef.name is
  # set, so `helm upgrade` never has a write path to the operator's Secret in
  # the first place, and their token (and any pusher already using it) is
  # never disturbed by upgrading.
  - it: should NOT generate a Secret when authTokenSecretRef.name is set
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token-secret
        authTokenSecretRef:
          name: my-own-auth-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should carry the proxy component labels
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token-secret
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

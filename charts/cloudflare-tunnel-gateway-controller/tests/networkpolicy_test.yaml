suite: test networkpolicy
templates:
  - networkpolicy.yaml
tests:
  - it: should not create NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create NetworkPolicy when enabled
    set:
      networkPolicy:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller

  - it: should have correct labels
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: cloudflare-tunnel-gateway-controller
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should select correct pods
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: cloudflare-tunnel-gateway-controller
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have both Ingress and Egress policy types
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should allow ingress on metrics port
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
      service:
        metricsPort: 8080
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8080

  - it: should allow ingress on health port
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
      service:
        healthPort: 8081
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8081

  - it: should allow ingress on custom ports
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
      service:
        metricsPort: 9090
        healthPort: 9091
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 9090
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 9091

  - it: should allow DNS egress UDP
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: UDP
            port: 53

  - it: should allow DNS egress TCP
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: TCP
            port: 53

  - it: should allow Kubernetes API egress
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 443
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 6443

  - it: should allow Cloudflare API egress to specific IP ranges only
    set:
      networkPolicy:
        enabled: true
    asserts:
      # Verify specific Cloudflare IPv4 ranges are present
      - contains:
          path: spec.egress[2].to
          content:
            ipBlock:
              cidr: "173.245.48.0/20"
      - contains:
          path: spec.egress[2].to
          content:
            ipBlock:
              cidr: "104.16.0.0/13"
      - contains:
          path: spec.egress[2].to
          content:
            ipBlock:
              cidr: "172.64.0.0/13"
      # Verify specific Cloudflare IPv6 ranges are present
      - contains:
          path: spec.egress[2].to
          content:
            ipBlock:
              cidr: "2606:4700::/32"
      # Verify port 443
      - contains:
          path: spec.egress[2].ports
          content:
            protocol: TCP
            port: 443

  # A NetworkPolicy egress rule with ports and no `to` permits those ports to
  # ANY destination, and rules are OR'd -- so an unscoped TCP/443 rule makes the
  # Cloudflare CIDR list below it decorative. The previous version of this test
  # looked for a literal 0.0.0.0/0 in the Cloudflare rule, where explicit CIDRs
  # are listed and it could never appear, so it passed by construction.
  # The shipped default carries no `to`, which permits the API ports to every
  # destination. Asserted rather than assumed: narrowing the default later must
  # be a deliberate change rather than a silent one, and a catch-all ipBlock is
  # not the same thing (see the value comment for why).
  - it: should leave the Kubernetes API destination unrestricted by default
    set:
      networkPolicy:
        enabled: true
    asserts:
      - notExists:
          path: spec.egress[1].to

  - it: should narrow the Kubernetes API destination when asked
    set:
      networkPolicy:
        enabled: true
        kubernetesApiIpBlocks:
          - 10.96.0.1/32
    asserts:
      - contains:
          path: spec.egress[1].to
          content:
            ipBlock:
              cidr: 10.96.0.1/32
      - notContains:
          path: spec.egress[1].to
          content:
            ipBlock:
              cidr: 0.0.0.0/0

  # A rule with ports and no `from` admits those ports from every source, so
  # an empty from renders no rule at all: in-cluster ingress is denied until
  # ingress.from names a source.
  - it: should admit no in-cluster source by default
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.ingress
          value: []

  - it: should allow ingress from specific namespace
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                name: monitoring

  - it: should allow ingress from specific pods
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - podSelector:
                matchLabels:
                  app: prometheus
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: prometheus

  - it: should allow ingress from multiple sources
    set:
      networkPolicy:
        enabled: true
        ingress:
          from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
            - podSelector:
                matchLabels:
                  app: prometheus
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                name: monitoring
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: prometheus

  # The proxy policy admits the controller on the config-API port and says so:
  # a config push must never be locked out. The controller policy forbade the
  # same connection, so enabling both left data planes unconfigured with Gateway
  # status still clean — the push is non-blocking, and it is the route status
  # that carries the complaint (#650).
  - it: should allow egress to the proxy config API port
    set:
      networkPolicy:
        enabled: true
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
    asserts:
      - contains:
          path: spec.egress[3].ports
          content:
            protocol: TCP
            port: 8081
      # Two rules, not two peers: the shared plane lives in this namespace,
      # per-Gateway planes live in their Gateway's. A bare podSelector never
      # leaves the policy's own namespace, so without the second rule a tenant's
      # data plane never receives a routing table — the same silent failure,
      # moved.
      - exists:
          path: spec.egress[3].to[0].podSelector
      - equal:
          path: spec.egress[4].to[0].namespaceSelector
          value: {}
      - equal:
          path: spec.egress[4].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: cloudflare-tunnel-gateway-proxy
      - contains:
          path: spec.egress[4].ports
          content:
            protocol: TCP
            port: 8081

  # proxy.configAPIPort moves every plane: the controller renders per-Gateway
  # planes on the port it is given with --proxy-config-api-port.
  - it: should move both egress rules with configAPIPort
    set:
      networkPolicy:
        enabled: true
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        configAPIPort: 9091
    asserts:
      - contains:
          path: spec.egress[3].ports
          content:
            protocol: TCP
            port: 9091
      - contains:
          path: spec.egress[4].ports
          content:
            protocol: TCP
            port: 9091

  # Same foot-gun the proxy policy already refuses: with both lists emptied the
  # Cloudflare rule renders `to: null` on 443, which NetworkPolicy reads as
  # allow-all — the opposite of the restriction the operator was reaching for.
  - it: should fail when the policy is enabled but cloudflareIpRanges is empty
    set:
      networkPolicy:
        enabled: true
        cloudflareIpRanges:
          ipv4: []
          ipv6: []
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.cloudflareIpRanges is empty"

  # An operator can write the value as an explicit null instead of two empty
  # lists. Helm drops a null user value before schema validation sees it, so this
  # reaches the guard's message rather than a rendering error.
  - it: should fail when cloudflareIpRanges is null rather than two empty lists
    set:
      networkPolicy:
        enabled: true
        cloudflareIpRanges: null
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.cloudflareIpRanges is empty"

  # The exit the fail message offers has to work: disabling the policy with the
  # lists still empty renders nothing, rather than failing on a guard the
  # operator has already escaped.
  - it: should render nothing when the policy is disabled and cloudflareIpRanges is empty
    set:
      networkPolicy:
        enabled: false
        cloudflareIpRanges:
          ipv4: []
          ipv6: []
    asserts:
      - hasDocuments:
          count: 0

  # The upgrade guide promises `{}` still renders the shipped ranges. That rests
  # on Helm merging it with the chart's own map, which is Helm's behaviour, not
  # this chart's -- so it gets a test rather than a footnote.
  - it: should keep the shipped ranges when cloudflareIpRanges is an empty map
    set:
      networkPolicy:
        enabled: true
        cloudflareIpRanges: {}
    asserts:
      - contains:
          path: spec.egress[2].to
          content:
            ipBlock:
              cidr: 173.245.48.0/20

  # One family is an allowlist, not an empty `to:`. Guarding on either list
  # being empty instead of both would reject an IPv4-only cluster.
  - it: should render the Cloudflare rule when only one address family is listed
    set:
      networkPolicy:
        enabled: true
        cloudflareIpRanges:
          ipv4:
            - 173.245.48.0/20
          ipv6: []
    asserts:
      - equal:
          path: spec.egress[2].to
          value:
            - ipBlock:
                cidr: 173.245.48.0/20

  # A values overlay that nulls the whole block means "no policy". Helm drops
  # the null key, so the template must read the missing map as disabled rather
  # than dereference it.
  - it: should render nothing when networkPolicy is null
    set:
      networkPolicy: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should admit no in-cluster source when ingress is null, as with an empty from
    set:
      networkPolicy:
        enabled: true
        ingress: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress
          value: []

  # The controller dials the OTLP collector named in controller.tracing.endpoint.
  # Its host names a Service, so the rule is scoped to that Service's namespace
  # and the endpoint's port rather than opened by port alone.
  - it: should allow egress to the tracing collector's namespace and port
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: otel-collector.observability:4317
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: observability
            ports:
              - protocol: TCP
                port: 4317

  - it: should read the collector namespace from a scheme-prefixed cluster FQDN
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: https://otel.obs.svc.cluster.local:4318
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: obs
            ports:
              - protocol: TCP
                port: 4318

  # A single-label host resolves through the pod's own search domain, which is
  # the release namespace.
  - it: should scope a bare Service name to the release namespace
    release:
      namespace: tunnel-system
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: otel-collector:4317
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: tunnel-system
            ports:
              - protocol: TCP
                port: 4317

  - it: should add no collector rule while tracing is disabled
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: false
          endpoint: otel-collector.observability:4317
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  # Loopback traffic never meets a NetworkPolicy, and an empty endpoint defers to
  # the OTLP defaults, which point at loopback.
  - it: should add no collector rule for a loopback endpoint
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: localhost:4317
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  - it: should add no collector rule for an IPv6 loopback endpoint
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: "[::1]:4317"
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  # A collector outside the cluster cannot be scoped by namespace. It still
  # renders: on :443 it exports through the API rule, and otherwise through a
  # NetworkPolicy the operator adds, which is additive with this one.
  - it: should render without a collector rule for an outside collector on 443
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: https://otel.example.com:443
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.egress
          count: 5

  - it: should render without a collector rule for an IP address endpoint
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: 10.0.0.1:4317
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  - it: should render without a collector rule when the endpoint has no port
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: otel-collector.observability
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  - it: should add no collector rule for an empty endpoint
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: ""
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  # A port no Service can carry would make the apiserver reject the policy,
  # and the release with it.
  - it: should render without a collector rule for an out-of-range port
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: otel-collector.observability:99999
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 5

  # A namespace name that YAML reads as a number must stay a string, or the
  # apiserver rejects the policy and the release with it.
  - it: should render a numeric-looking collector namespace as a string
    set:
      networkPolicy:
        enabled: true
      controller:
        tracing:
          enabled: true
          endpoint: otel.123:4317
    asserts:
      - equal:
          path: spec.egress[5].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "123"

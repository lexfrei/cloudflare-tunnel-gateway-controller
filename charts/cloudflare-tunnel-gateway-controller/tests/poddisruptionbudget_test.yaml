suite: test poddisruptionbudget
templates:
  - poddisruptionbudget.yaml
tests:
  - it: should not create PDB by default
    asserts:
      - template: poddisruptionbudget.yaml
        hasDocuments:
          count: 0

  - it: should create PDB when enabled
    set:
      podDisruptionBudget:
        enabled: true
    asserts:
      - template: poddisruptionbudget.yaml
        isKind:
          of: PodDisruptionBudget
      - template: poddisruptionbudget.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller

  - it: should set minAvailable when specified
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.minAvailable
          value: 2
      - template: poddisruptionbudget.yaml
        notExists:
          path: spec.maxUnavailable

  - it: should set maxUnavailable when specified
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.maxUnavailable
          value: 1
      - template: poddisruptionbudget.yaml
        notExists:
          path: spec.minAvailable

  - it: should support percentage values for minAvailable
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: "50%"
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.minAvailable
          value: "50%"

  - it: should support percentage values for maxUnavailable
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: "25%"
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.maxUnavailable
          value: "25%"

  - it: should set unhealthyPodEvictionPolicy when specified
    set:
      podDisruptionBudget:
        enabled: true
        unhealthyPodEvictionPolicy: "AlwaysAllow"
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.unhealthyPodEvictionPolicy
          value: "AlwaysAllow"

  - it: should not set unhealthyPodEvictionPolicy when null
    set:
      podDisruptionBudget:
        enabled: true
        unhealthyPodEvictionPolicy: null
    asserts:
      - template: poddisruptionbudget.yaml
        notExists:
          path: spec.unhealthyPodEvictionPolicy

  - it: should have correct selector labels
    set:
      podDisruptionBudget:
        enabled: true
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: cloudflare-tunnel-gateway-controller
      - template: poddisruptionbudget.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have correct labels
    set:
      podDisruptionBudget:
        enabled: true
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: cloudflare-tunnel-gateway-controller
      - template: poddisruptionbudget.yaml
        equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - template: poddisruptionbudget.yaml
        exists:
          path: metadata.labels["app.kubernetes.io/version"]

  - it: should work with fullnameOverride
    set:
      fullnameOverride: "my-custom-pdb"
      podDisruptionBudget:
        enabled: true
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: metadata.name
          value: my-custom-pdb

  - it: should work with nameOverride
    set:
      nameOverride: "cf-ctrl"
      podDisruptionBudget:
        enabled: true
    asserts:
      - template: poddisruptionbudget.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-cf-ctrl

  - it: should render minAvailable 0 rather than dropping it
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 0
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  # The API server rejects a budget carrying both fields. Setting
  # maxUnavailable without nulling the minAvailable default is the easy way
  # to get there, so name the fix at render time.
  - it: should fail when both minAvailable and maxUnavailable are set
    set:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorPattern: "Set only one of podDisruptionBudget.minAvailable and podDisruptionBudget.maxUnavailable"

  - it: should fail when minAvailable is 0 and maxUnavailable is set
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 0
        maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorPattern: "Set only one of podDisruptionBudget.minAvailable and podDisruptionBudget.maxUnavailable"

  - it: should render maxUnavailable 0 when it is the only bound
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 0
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0
      - notExists:
          path: spec.minAvailable

  - it: should render nothing when podDisruptionBudget is null
    set:
      podDisruptionBudget: null
    asserts:
      - template: poddisruptionbudget.yaml
        hasDocuments:
          count: 0

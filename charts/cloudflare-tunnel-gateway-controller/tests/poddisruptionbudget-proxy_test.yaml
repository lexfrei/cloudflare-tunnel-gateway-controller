suite: test proxy poddisruptionbudget
templates:
  - poddisruptionbudget-proxy.yaml
tests:
  - it: should not create a proxy PDB by default
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
    asserts:
      - hasDocuments:
          count: 0

  - it: should select the proxy pods, not the controller
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        podDisruptionBudget:
          enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-proxy
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: proxy
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget

  - it: should render maxUnavailable instead of minAvailable when asked
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        podDisruptionBudget:
          enabled: true
          minAvailable: null
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

suite: test proxy serviceaccount
templates:
  - serviceaccount-proxy.yaml
  - deployment-proxy.yaml
tests:
  - it: should not create a proxy ServiceAccount by default
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
    asserts:
      - template: serviceaccount-proxy.yaml
        hasDocuments:
          count: 0
      - template: deployment-proxy.yaml
        notExists:
          path: spec.template.spec.serviceAccountName

  - it: should create a dedicated ServiceAccount and run the proxy on it
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        serviceAccount:
          create: true
    asserts:
      - template: serviceaccount-proxy.yaml
        isKind:
          of: ServiceAccount
      - template: serviceaccount-proxy.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-proxy
      - template: serviceaccount-proxy.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: deployment-proxy.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-proxy

  - it: should name the created ServiceAccount after proxy.serviceAccount.name
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        serviceAccount:
          create: true
          name: edge-proxy
          annotations:
            example.com/owner: platform
    asserts:
      - template: serviceaccount-proxy.yaml
        equal:
          path: metadata.name
          value: edge-proxy
      - template: serviceaccount-proxy.yaml
        equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - template: deployment-proxy.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: edge-proxy

  - it: should run the proxy on an existing ServiceAccount without creating one
    set:
      proxy:
        tunnelTokenSecretRef:
          name: tunnel-token
        serviceAccount:
          name: existing-sa
    asserts:
      - template: serviceaccount-proxy.yaml
        hasDocuments:
          count: 0
      - template: deployment-proxy.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
      - template: deployment-proxy.yaml
        equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
